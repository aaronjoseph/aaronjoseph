<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron Joseph Mathew — Senior AI &amp; Search Systems Engineer</title>
  <meta name="description" content="Senior AI Engineer with 9+ years across production search, learning-to-rank, LLM evaluation, and low-latency Python & Rust systems serving up to 12,000 RPS." />
  <meta property="og:title" content="Aaron Joseph Mathew — Senior AI & Search Systems Engineer" />
  <meta property="og:description" content="Production search, ranking, LLM evaluation, and Rust/Python ML systems built for high throughput and low latency." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f5f1e3" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='18' fill='%23f4dc62'/%3E%3Crect x='2.5' y='2.5' width='59' height='59' rx='15.5' stroke='%23231f1b' stroke-width='3'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23231f1b' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='19' letter-spacing='-0.6'%3EAJM%3C/text%3E%3Ccircle cx='50' cy='14' r='4.2' fill='%233b8a6c'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #f5f1e3;
      color: #231f1b;
    }
    .aj-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #f5f1e3;
      background-image:
        radial-gradient(circle at 22% 28%, rgba(242, 181, 164, 0.35), transparent 36%),
        radial-gradient(circle at 78% 26%, rgba(198, 216, 135, 0.35), transparent 34%),
        radial-gradient(circle at 72% 78%, rgba(142, 130, 180, 0.25), transparent 38%),
        radial-gradient(rgba(35, 31, 27, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    .aj-splash.aj-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .aj-logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      animation: aj-bob 1.7s ease-in-out infinite;
    }
    .aj-logo-shadow {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: #231f1b;
      transform: translate(5px, 5px);
    }
    .aj-logo-svg {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }
    .aj-dots {
      display: flex;
      gap: 8px;
    }
    .aj-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid #231f1b;
      animation: aj-bounce 1.2s ease-in-out infinite;
    }
    .aj-dots span:nth-child(1) { background: #f2b5a4; animation-delay: 0s; }
    .aj-dots span:nth-child(2) { background: #c6d887; animation-delay: 0.14s; }
    .aj-dots span:nth-child(3) { background: #f4dc62; animation-delay: 0.28s; }
    .aj-dots span:nth-child(4) { background: #3b8a6c; animation-delay: 0.42s; }
    .aj-dots span:nth-child(5) { background: #8e82b4; animation-delay: 0.56s; }
    @keyframes aj-bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes aj-bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .aj-logo-wrap, .aj-dots span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="aj-splash" class="aj-splash" role="status" aria-label="Loading Aaron Joseph Mathew">
    <div class="aj-logo-wrap">
      <div class="aj-logo-shadow" aria-hidden="true"></div>
      <svg class="aj-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#f4dc62" />
        <rect x="2" y="2" width="60" height="60" rx="14" stroke="#231f1b" stroke-width="2.6" />
        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#231f1b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="-0.6">AJM</text>
        <circle cx="50" cy="13" r="4" fill="#3b8a6c" stroke="#231f1b" stroke-width="1.4" />
      </svg>
    </div>
    <div class="aj-dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div id="main"></div>
</body>
</html>
