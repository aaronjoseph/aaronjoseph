<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron Joseph Mathew — Senior AI &amp; Search Systems Engineer</title>
  <meta name="description" content="Senior AI Engineer with 9+ years across production search, learning-to-rank, LLM evaluation, and low-latency Python & Rust systems serving up to 12,000 RPS." />
  <meta property="og:title" content="Aaron Joseph Mathew — Senior AI & Search Systems Engineer" />
  <meta property="og:description" content="Production search, ranking, LLM evaluation, and Rust/Python ML systems built for high throughput and low latency." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f2eee6" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='18' fill='%23e8cdc2'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%2332323d' font-family='system-ui,sans-serif' font-weight='800' font-size='20' letter-spacing='-0.5'%3EAJM%3C/text%3E%3Ccircle cx='50' cy='14' r='4.2' fill='%23d97c60'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />

  <style>
    html {
      scrollbar-gutter: stable;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #f2eee6;
      color: #32323d;
    }
    #main {
      opacity: 0;
      transition: opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity;
    }
    body.aj-ready #main {
      opacity: 1;
      will-change: auto;
    }
    .aj-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #f2eee6;
      background-image:
        radial-gradient(ellipse 68% 42% at 14% 8%, rgba(232, 205, 194, 0.42), transparent 68%),
        radial-gradient(ellipse 62% 44% at 88% 12%, rgba(206, 224, 214, 0.44), transparent 70%),
        radial-gradient(ellipse 58% 38% at 78% 82%, rgba(218, 211, 232, 0.34), transparent 68%),
        radial-gradient(ellipse 52% 38% at 18% 76%, rgba(231, 224, 211, 0.72), transparent 68%);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      will-change: opacity;
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s ease;
    }
    .aj-splash.aj-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .aj-splash.aj-hidden .aj-logo-wrap,
    .aj-splash.aj-hidden .aj-dots {
      opacity: 0;
      transform: translateY(-4px) scale(0.96);
      transition: opacity 0.24s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .aj-logo-wrap {
      position: relative;
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      animation: aj-float 2.2s ease-in-out infinite;
    }
    .aj-logo-svg {
      width: 86px;
      height: 86px;
      border-radius: 26px;
      box-shadow: 0 16px 38px rgba(217, 124, 96, 0.18), 0 4px 12px rgba(50, 50, 61, 0.06);
    }
    .aj-dots {
      display: flex;
      gap: 8px;
    }
    .aj-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      animation: aj-bounce 1.25s ease-in-out infinite;
    }
    .aj-dots span:nth-child(1) { background: #e8cdc2; animation-delay: 0s; }
    .aj-dots span:nth-child(2) { background: #d97c60; animation-delay: 0.16s; }
    .aj-dots span:nth-child(3) { background: #8bb9a4; animation-delay: 0.32s; }
    .aj-dots span:nth-child(4) { background: #9b92b5; animation-delay: 0.48s; }
    @keyframes aj-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes aj-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.65; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aj-logo-wrap, .aj-dots span {
        animation: none;
      }
      #main, .aj-splash {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>
<body>
  <div id="aj-splash" class="aj-splash" role="status" aria-label="Loading Aaron Joseph Mathew">
    <div class="aj-logo-wrap">
      <svg class="aj-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="18" fill="#faf8f3" />
        <rect x="4" y="4" width="56" height="56" rx="14" fill="#f3e3db" />
        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#32323d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18.5" letter-spacing="-0.6">AJM</text>
        <circle cx="50" cy="14" r="4" fill="#d97c60" />
      </svg>
    </div>
    <div class="aj-dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div id="main"></div>
</body>
</html>
